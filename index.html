<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">∞ Infinity Lab</div>
    <nav class="primary-nav" id="primary-nav">
      <!-- "Start"-Button ist fest im HTML, Experiment-Buttons trägt main.js automatisch ein -->
      <button type="button" class="nav-link is-active" id="nav-home">Start</button>
    </nav>
  </header>

  <main>

    <!-- Startseite: Hero + Kartenübersicht. Wird gezeigt, solange kein Experiment aktiv ist. -->
    <section id="home-view">

      <section class="hero">
        <h1>∞ Infinity Lab</h1>
        <p class="hero-subtitle">Interaktive Experimente zu mathematischer Unendlichkeit</p>
      </section>

      <section class="experiments">
        <h2>Experimente</h2>
        <div class="card-grid" id="experiment-cards">
          <!-- Die drei Experiment-Karten trägt main.js aus registry.js hier ein -->
        </div>
      </section>

    </section>

    <!-- Anzeigefläche für ein einzelnes Experiment. Bleibt versteckt, bis in der Nav
         ein Experiment ausgewählt wird. -->
    <section id="experiment-stage" hidden></section>

  </main>

  <footer class="site-footer">
    <p>Jugend forscht Projekt &middot; Infinity Lab</p>
  </footer>

  <!-- type="module" erlaubt uns, die Dateien in js/modules/ per import einzubinden -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
